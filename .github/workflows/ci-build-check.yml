name: "CI: Downstream Build Check"

on:
  pull_request:
    branches: [main, develop, "release/**"]

concurrency:
  group: downstream-build-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-check:
    name: Downstream build check
    if: ${{ !contains(github.event.pull_request.body, '/skip-build-and-lint') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      APP_ID: ${{ secrets.OTTEHR_GITHUB_APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.OTTEHR_GITHUB_APP_PRIVATE_KEY }}
      DOWNSTREAM_REPO: ${{ github.repository_owner }}/${{ vars.DOWNSTREAM_BUILD_REPO }}
      DOWNSTREAM_WORKFLOW: ${{ vars.DOWNSTREAM_BUILD_WORKFLOW }}
      DOWNSTREAM_REF: ${{ vars.DOWNSTREAM_BUILD_REF || 'develop' }}
    steps:
      - name: Reject pull requests from forks
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::CI runs only for branches of this repository. Push the branch here and reopen the PR."
          exit 1

      - name: Fetch CI script
        run: |
          git init -q ci-script
          git -C ci-script remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C ci-script fetch -q --depth 1 --filter=blob:none origin "$GITHUB_SHA"
          git -C ci-script checkout -q FETCH_HEAD -- .github/scripts/downstream-ci.mjs
          node --version

      - name: Dispatch downstream build
        id: dispatch
        run: node ci-script/.github/scripts/downstream-ci.mjs dispatch

      - name: Wait for downstream build
        env:
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
          CANCEL_ON_ABORT: "true"
        run: node ci-script/.github/scripts/downstream-ci.mjs wait
