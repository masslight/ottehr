name: "CI: Lint and Build"

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop, "release/**"]

permissions:
  contents: read

jobs:
  lint-and-build:
    name: lint-and-build (22)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      APP_ID: ${{ secrets.OTTEHR_GITHUB_APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.OTTEHR_GITHUB_APP_PRIVATE_KEY }}
      DOWNSTREAM_REPO: ${{ github.repository_owner }}/${{ vars.DOWNSTREAM_BUILD_REPO }}
      DOWNSTREAM_WORKFLOW: ${{ vars.DOWNSTREAM_LINT_AND_BUILD_WORKFLOW }}
      DOWNSTREAM_REF: ${{ vars.DOWNSTREAM_BUILD_REF || 'develop' }}
    steps:
      - name: Reject pull requests from forks
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::CI runs only for branches of this repository. Push the branch here and reopen the PR."
          exit 1

      - name: Checkout CI scripts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Dispatch downstream lint and build
        id: dispatch
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node .github/scripts/downstream-ci.mjs dispatch

      - name: Wait for downstream lint and build
        env:
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
          CANCEL_ON_ABORT: "true"
        run: node .github/scripts/downstream-ci.mjs wait
