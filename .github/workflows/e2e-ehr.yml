name: EHR E2E Tests

env:
  NODE_VERSION: 22
  TEST_RESULTS_CACHE_RETENTION_DAYS: 30
  SECRETS_REPOSITORY: ${{ vars.SECRETS_REPOSITORY }} # Secrets repository for configuration files
  PLAYWRIGHT_CACHE_PATH: ~/.cache/ms-playwright

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to run tests on"
        required: true
        type: choice
        options:
          - e2e
          - e2e2
          - e2e3
          - e2e4
          - e2e5
          - local
          - testing
          - development
          - staging
          - demo
        default: "local"
      mode:
        description: "Tests running mode"
        required: false
        type: choice
        options:
          - normal
          - smoke
        default: "normal"
  workflow_call:
    inputs:
      environment:
        required: false
        type: string
      aws_deploy_role:
        required: false
        type: string

jobs:
  check-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      should-run: ${{ steps.check.outputs.should-run }}
      skip-reason: ${{ steps.check.outputs.skip-reason }}
      environment: ${{ steps.env.outputs.environment }}
    steps:
      - name: Determine Environment
        id: env
        run: |
          INPUT_ENV="${{ inputs.environment }}"
          if [ -n "$INPUT_ENV" ]; then
            echo "environment=$INPUT_ENV" >> $GITHUB_OUTPUT
          elif [ "${{ github.repository }}" == "masslight/ottehr" ]; then
            echo "environment=e2e" >> $GITHUB_OUTPUT
          else
            echo "environment=local" >> $GITHUB_OUTPUT
          fi

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # Need full history for diffs in all scenarios

      - name: Check if EHR changes are relevant
        id: check
        run: |
          # For workflow_call or workflow_dispatch, check event type
          # If strictly workflow_dispatch, run unconditionally
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "should-run=true" >> $GITHUB_OUTPUT
            echo "skip-reason=" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Check for force run command in PR description
          if [ "${{ contains(github.event.pull_request.body || '', '/run-ehr-e2e') }}" == "true" ]; then
             echo "Force run enabled via PR command /run-ehr-e2e"
             echo "should-run=true" >> $GITHUB_OUTPUT
             echo "skip-reason=" >> $GITHUB_OUTPUT
             exit 0
          fi

          # Check for skip command in PR description
          if [ "${{ contains(github.event.pull_request.body || '', '/skip-ehr-e2e') }}" == "true" ]; then
             echo "EHR E2E tests skipped via /skip-ehr-e2e command"
             echo "should-run=false" >> $GITHUB_OUTPUT
             echo "skip-reason=Skipped via /skip-ehr-e2e command" >> $GITHUB_OUTPUT
             exit 0
          fi

          # For other events, check changed files
          TRACKED_FILES=$(node -e "
            const config = require('./.github/trigger-paths.js');
            console.log(config.getE2EPaths('ehr').join(' '));
          ")
          node .github/check-changed-files.js $TRACKED_FILES

  ehr-e2e-tests-run:
    needs: check-changes
    if: always() && !cancelled() && needs.check-changes.outputs.should-run == 'true'
    runs-on: ubuntu-latest-8-cores
    timeout-minutes: 40
    permissions:
      id-token: write # Required for OIDC
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node modules
        id: npm-cache-restore
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
            deploy/node_modules
          key: ${{ runner.os }}-npm-cache-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-cache-

      - name: Install dependencies
        if: steps.npm-cache-restore.outputs.cache-hit != 'true'
        run: for i in {1..3}; do npm ci && s=0 && break || s=$? && sleep 5; done; (exit $s)

      - name: Restore Playwright browsers
        id: playwright-cache-restore
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.PLAYWRIGHT_CACHE_PATH }}
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Resolve secrets branch
        id: resolve-secrets
        uses: ./.github/actions/resolve-secrets-branch
        with:
          core-branch: ${{ github.head_ref || github.ref_name }}
          secrets-repository: ${{ env.SECRETS_REPOSITORY }}
          ssh-key: ${{ secrets.DEPLOY_OTTEHR_KEY }}
          token: ${{ github.token }}

      - name: Check out secrets repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ env.SECRETS_REPOSITORY }}
          ssh-key: ${{ secrets.DEPLOY_OTTEHR_KEY }}
          ref: ${{ steps.resolve-secrets.outputs.branch }}
          path: "secrets"

      - name: Populate and validate secrets
        uses: ./.github/actions/populate-secrets
        with:
          environment: ${{ inputs.environment }}
          copy-test-config-files: true
          aws-deploy-role: ${{ inputs.aws_deploy_role || vars.AWS_DEPLOY_ROLE }}
          pull-generated-config-from-terraform-state: true

      # Built alongside the terraform apply by the build-ehr-bundle job so this job doesn't pay for it.
      # Absent for a standalone workflow_dispatch of this workflow, in which case run-e2e.ts builds as
      # usual — hence continue-on-error.
      - name: Download prebuilt EHR bundle
        id: download-bundle
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ehr-bundle-${{ needs.check-changes.outputs.environment }}
          # The artifact's paths share apps/ehr as their common ancestor, so it unpacks as
          # build/ and env/.env.<env>.prebuilt — extract into apps/ehr to restore the real layout.
          path: apps/ehr

      # That bundle was built against an env file generated from terraform state before the apply
      # finished. If the apply changed it, the bundle is stale: drop it and let run-e2e.ts rebuild
      # against the copy this job just generated.
      - name: Discard the prebuilt bundle if its env no longer matches
        if: steps.download-bundle.outcome == 'success'
        run: |
          ENV_FILE="apps/ehr/env/.env.${{ needs.check-changes.outputs.environment }}"
          if [ ! -f "$ENV_FILE" ]; then
            echo "No env file to compare against; discarding the prebuilt bundle."
            rm -rf apps/ehr/build
          elif cmp -s "$ENV_FILE" "$ENV_FILE.prebuilt"; then
            echo "Prebuilt bundle matches this job's env; using it."
          else
            echo "Env changed since the bundle was built; discarding it and rebuilding."
            rm -rf apps/ehr/build
          fi
          rm -f "$ENV_FILE.prebuilt"

      - name: Run E2E tests
        run: |
          ENV="${{ needs.check-changes.outputs.environment }}"
          MODE="${{ inputs.mode }}"
          if [ "$MODE" == "smoke" ]; then
            npm run ehr:e2e:$ENV:smoke
          else
            npm run ehr:e2e:$ENV
          fi
        env:
          CI: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-ehr-${{ needs.check-changes.outputs.environment }}
          path: |
            apps/ehr/playwright-report/
            apps/ehr/test-results/
          retention-days: ${{ env.TEST_RESULTS_CACHE_RETENTION_DAYS }}

  # This job always runs and satisfies branch protection rules
  ehr-e2e-tests:
    needs: [check-changes, ehr-e2e-tests-run]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Report status
        run: |
          if [ "${{ needs.check-changes.outputs.should-run }}" == "false" ]; then
            echo "EHR E2E tests skipped: ${{ needs.check-changes.outputs.skip-reason }}"
            exit 0
          elif [ "${{ needs.ehr-e2e-tests-run.result }}" == "success" ]; then
            echo "EHR E2E tests passed"
            exit 0
          elif [ "${{ needs.ehr-e2e-tests-run.result }}" == "failure" ]; then
            echo "EHR E2E tests failed"
            exit 1
          elif [ "${{ needs.ehr-e2e-tests-run.result }}" == "cancelled" ]; then
            echo "EHR E2E tests cancelled"
            exit 1
          elif [ "${{ needs.ehr-e2e-tests-run.result }}" == "skipped" ]; then
            echo "EHR E2E tests skipped (execution job skipped)"
            exit 0
          else
            echo "EHR E2E tests status unknown: ${{ needs.ehr-e2e-tests-run.result }}"
            exit 1
          fi
