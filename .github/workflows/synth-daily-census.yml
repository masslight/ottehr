name: Synthetic Daily Census

# Keeps a lower/demo environment's tracking board looking like a live clinic:
# each run signs off the prior day's open synthetic visits and creates a fresh
# batch dated today (see scripts/synthetic-patient-data/DAILY-CENSUS.md).
#
# Manual-only for now (run it from the Actions tab against any branch that has
# the synth harness). To run it automatically once this lands on the default
# branch, uncomment the `schedule:` block below — GitHub cron is UTC with no DST,
# so 12:15 UTC ≈ 07:15–08:15 America/New_York depending on the season, which is
# fine for a "each morning" census.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment (lower/demo only — NEVER production)"
        type: choice
        options: [demo, development, testing, staging, local, e2e]
        default: demo
      count:
        description: "How many new visits to create for today"
        default: "40"
      phase:
        description: "Which phase to run"
        type: choice
        options: [both, catchup, generate]
        default: both
      dry:
        description: "Dry-run (validate + log, no writes)"
        type: boolean
        default: false
  # schedule:
  #   - cron: "15 12 * * *" # daily ~07:15 ET; only fires from the default branch

env:
  NODE_VERSION: 22

concurrency:
  # Never let two census runs hit the same env at once (they'd both try to fill
  # today's quota). Different envs run independently.
  group: synth-census-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Refuse production
        run: |
          case "${{ inputs.environment }}" in
            production|prod) echo "::error::the census must never run against production"; exit 1 ;;
          esac

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: for i in {1..3}; do npm ci && s=0 && break || s=$? && sleep 5; done; (exit $s)

      - name: Resolve secrets branch
        id: resolve-secrets
        uses: ./.github/actions/resolve-secrets-branch
        with:
          core-branch: ${{ github.head_ref || github.ref_name }}
          secrets-repository: ${{ vars.SECRETS_REPOSITORY }}
          ssh-key: ${{ secrets.DEPLOY_OTTEHR_KEY }}
          token: ${{ github.token }}

      - name: Check out secrets repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ vars.SECRETS_REPOSITORY }}
          ssh-key: ${{ secrets.DEPLOY_OTTEHR_KEY }}
          ref: ${{ steps.resolve-secrets.outputs.branch }}
          path: secrets

      - name: Populate secrets
        uses: ./.github/actions/populate-secrets
        with:
          environment: ${{ inputs.environment }}

      - name: Materialize zambda env files
        # populate-secrets writes config/.env/<env>.json (M2M creds + all server
        # secrets in one file). The census wrapper + local server read them from
        # packages/zambdas/.env/, so mirror them there (M2M creds file + the
        # server's secrets file). 0600 so the values never sit world-readable.
        run: |
          set -euo pipefail
          SRC="config/.env/${{ inputs.environment }}.json"
          [ -f "$SRC" ] || { echo "::error::$SRC missing after populate-secrets"; exit 1; }
          mkdir -p packages/zambdas/.env
          cp "$SRC" "packages/zambdas/.env/${{ inputs.environment }}.json"
          cp "$SRC" "packages/zambdas/.env/zambda-secrets-${{ inputs.environment }}.json"
          chmod 600 packages/zambdas/.env/*.json

      - name: Run daily census
        # The wrapper boots its own ephemeral local zambda server (redacted log,
        # torn down after), so no separate server step is needed here.
        run: |
          set -uo pipefail
          DRY=""
          [ "${{ inputs.dry }}" = "true" ] && DRY="--dry"
          bash scripts/synthetic-patient-data/run-daily-census.sh \
            --env "${{ inputs.environment }}" \
            --count "${{ inputs.count }}" \
            --phase "${{ inputs.phase }}" \
            $DRY

      - name: Upload census logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: census-logs-${{ inputs.environment }}
          path: scripts/synthetic-patient-data/.census-logs/
          retention-days: 7
          if-no-files-found: ignore
