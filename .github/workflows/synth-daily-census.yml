name: Synthetic Daily Census

# ── Registration stub (default branch) ───────────────────────────────────────
# GitHub only lists a workflow and lets you "Run workflow" against another branch
# once the file exists on the DEFAULT branch. This stub does nothing on its own —
# the REAL implementation lives on the feature branch
# (dabrams/otr-2435-get-realistic-test-data-in-demo-and-lower-envs). When you
# dispatch this workflow and pick that branch, GitHub runs THAT branch's version.
# The inputs below mirror the feature-branch file so the dispatch dialog (which is
# rendered from the default branch) shows the right fields.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment (lower/demo only — NEVER production)"
        type: choice
        options: [demo, development, testing, staging, local, e2e]
        default: demo
      count:
        description: "How many new visits to create for today"
        default: "40"
      phase:
        description: "Which phase to run"
        type: choice
        options: [both, catchup, generate]
        default: both
      dry:
        description: "Dry-run (validate + log, no writes)"
        type: boolean
        default: false

jobs:
  stub:
    runs-on: ubuntu-latest
    steps:
      - name: Registration stub
        run: |
          echo "This is the default-branch registration stub."
          echo "Run this workflow against the branch that contains the synth harness"
          echo "to execute the real Synthetic Daily Census."
