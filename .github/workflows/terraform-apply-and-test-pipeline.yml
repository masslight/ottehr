name: Terraform apply and Test Pipeline

on:
  workflow_dispatch:
    inputs:
      environment:
        required: false
        type: string
      node_version:
        required: true
        type: string
        default: "22"
      aws_deploy_role:
        required: true
        type: string
      secrets_repository:
        required: true
        type: string
      run_automated_tests:
        description: "Run automated tests"
        required: false
        type: boolean
        default: true
      run_ehr_e2e:
        description: "Run EHR E2E tests"
        required: false
        type: boolean
        default: true
      run_intake_e2e:
        description: "Run Intake E2E tests"
        required: false
        type: boolean
        default: true
      skip_terraform_apply:
        description: "Skip Terraform Apply (run jobs in parallel without apply)"
        required: false
        type: boolean
        default: false
  push:
    branches: [main, develop, "release/**"]
    paths:
      - "apps/ehr/**"
      - "apps/intake/**"
      - "apps/billing/**"
      - "packages/zambdas/**"
      - "packages/utils/**"
      - "packages/ui-components/**"
      - packages/spec/**
      - "scripts/**"
      - ".github/**"
      - ".prettierignore"
      - "package.json"
      - "config/**"
  pull_request:
    branches: [main, develop, "release/**"]
    paths:
      - "apps/ehr/**"
      - "apps/intake/**"
      - "apps/billing/**"
      - "packages/zambdas/**"
      - "packages/utils/**"
      - "packages/ui-components/**"
      - packages/spec/**
      - "scripts/**"
      - ".github/**"
      - ".prettierignore"
      - "package.json"
      - "config/**"
      - "deploy/**"

env:
  NODE_VERSION: 22
  NODE_OPTIONS: "--max_old_space_size=8192"
  AWS_DEPLOY_ROLE: ${{ vars.AWS_DEPLOY_ROLE }}
  SECRETS_REPOSITORY: ${{ vars.SECRETS_REPOSITORY }}

jobs:
  determine-environment:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      environment: ${{ steps.finalize-env.outputs.environment }}
      should-run-apply: ${{ steps.check.outputs.should-run-apply }}
      coverage-only: ${{ steps.check.outputs.coverage-only }}
      concurrency-group: ${{ steps.concurrency.outputs.group }}
    steps:
      - name: Determine Environment
        id: env
        run: |
          echo "========================================="
          echo "STEP 1: Initial Environment Determination"
          echo "========================================="
          echo "Repository: ${{ github.repository }}"
          echo "Event: ${{ github.event_name }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "Run Number: ${{ github.run_number }}"

          INPUT_ENV="${{ inputs.environment }}"
          echo "Manual input environment: '${INPUT_ENV}'"

          if [ -n "$INPUT_ENV" ]; then
            ENV="$INPUT_ENV"
            echo "[OK] Using manually specified environment: $ENV"
          elif [ "${{ github.repository }}" != "masslight/ottehr" ]; then
            # Downstream repositories use local environment
            ENV="local"
            echo "[OK] Downstream repository detected - using local environment"
          else
            # For masslight/ottehr, the next step maps the branch to a workspace
            ENV=""
            echo "[OK] masslight/ottehr detected - will select workspace by branch affinity"
          fi

          # Safety check: only allow local, e2e, e2e2, e2e3, e2e4, and e2e5 environments
          if [ -n "$ENV" ]; then
            if [[ "$ENV" != "local" && "$ENV" != "e2e" && "$ENV" != "e2e2" && "$ENV" != "e2e3" && "$ENV" != "e2e4" && "$ENV" != "e2e5" ]]; then
              echo "[ERROR] Environment must be 'local', 'e2e', 'e2e2', 'e2e3', 'e2e4', or 'e2e5' for this workflow. Got: $ENV"
              exit 1
            fi
            echo "[OK] Environment validation passed: $ENV"
            echo "environment=$ENV" >> $GITHUB_OUTPUT
          else
            echo "[INFO] Environment will be determined by branch affinity step"
          fi
          echo "========================================="

      # Each workspace keeps whatever the last branch to deploy there left behind.
      # Picking by a count of active runs means consecutive pushes to one PR
      # usually land somewhere different, and because every Zambda bundles
      # packages/utils, an unrelated branch's build makes all ~390 zips differ.
      # Measured: a workspace already holding the same bundles planned 9 changes
      # and applied in 1.8s; a stale one planned 397 and took 13.1s.
      #
      # So map a branch to a workspace instead, and keep it there. Other active
      # runs get the same treatment, so a run can work out where they are headed
      # without any shared state, and step aside when its own first choice is
      # already claimed.
      - name: Select Environment By Branch Affinity
        if: steps.env.outputs.environment == ''
        id: load-balance
        env:
          GH_TOKEN: ${{ github.token }}
          SELF_BRANCH: ${{ github.head_ref || github.ref_name }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -uo pipefail
          echo "========================================="
          echo "Environment Selection (branch affinity)"
          echo "========================================="

          ENVS=(e2e e2e2 e2e3 e2e4 e2e5)

          # cksum is POSIX and stable across runners, which matters more here
          # than the hash quality — the same branch must always land on the same
          # workspace.
          affinity_index() {
            local sum
            sum=$(printf '%s' "$1" | cksum | cut -d' ' -f1)
            echo $(( sum % ${#ENVS[@]} ))
          }

          PREFERRED=$(affinity_index "$SELF_BRANCH")
          echo "Branch: $SELF_BRANCH"
          echo "Preferred workspace: ${ENVS[$PREFERRED]}"

          # Any failure here must not block deploys, so fall back to the
          # preferred workspace and say so.
          OTHER_BRANCHES=$(gh api "repos/${REPOSITORY}/actions/workflows/terraform-apply-and-test-pipeline.yml/runs?per_page=50" \
            --jq "[.workflow_runs[]
                   | select(.status == \"pending\" or .status == \"queued\" or .status == \"in_progress\")
                   | select(.id != ${CURRENT_RUN_ID})
                   | .head_branch] | unique | .[]" 2>/dev/null) || {
            echo "[WARN] Could not list active runs; using preferred workspace."
            OTHER_BRANCHES=""
          }

          claims=()
          for _ in "${ENVS[@]}"; do claims+=(0); done
          while IFS= read -r branch; do
            [ -z "$branch" ] && continue
            # A run on our own branch wants the same workspace we do, and has to
            # queue behind us anyway. Not a reason to move.
            [ "$branch" = "$SELF_BRANCH" ] && continue
            idx=$(affinity_index "$branch")
            claims[$idx]=$(( claims[$idx] + 1 ))
            echo "  active: $branch -> ${ENVS[$idx]}"
          done <<< "$OTHER_BRANCHES"

          # Take the preferred workspace when it is free. Otherwise the least
          # claimed, scanning from the preferred one so the choice stays stable.
          CHOICE=$PREFERRED
          if [ "${claims[$PREFERRED]}" -ne 0 ]; then
            BEST=${claims[$PREFERRED]}
            for offset in $(seq 1 $(( ${#ENVS[@]} - 1 ))); do
              i=$(( (PREFERRED + offset) % ${#ENVS[@]} ))
              if [ "${claims[$i]}" -lt "$BEST" ]; then
                BEST=${claims[$i]}
                CHOICE=$i
              fi
            done
            echo "Preferred workspace is claimed (${claims[$PREFERRED]} run(s)); stepping aside."
          fi

          ENV="${ENVS[$CHOICE]}"
          echo ""
          echo "Selected: $ENV"
          echo "environment=$ENV" >> $GITHUB_OUTPUT
          echo "========================================="
      - name: Finalize Environment Selection
        id: finalize-env
        run: |
          echo "========================================="
          echo "STEP 3: Finalize Environment Selection"
          echo "========================================="

          LOAD_BALANCED_ENV="${{ steps.load-balance.outputs.environment }}"
          INITIAL_ENV="${{ steps.env.outputs.environment }}"

          echo "Initial environment: '${INITIAL_ENV}'"
          echo "Load-balanced environment: '${LOAD_BALANCED_ENV}'"

          # Use load-balanced environment if available, otherwise use the one from initial determination
          if [ -n "$LOAD_BALANCED_ENV" ]; then
            ENV="$LOAD_BALANCED_ENV"
            echo "[OK] Using load-balanced environment"
          else
            ENV="$INITIAL_ENV"
            echo "[OK] Using initial environment (manual or downstream)"
          fi

          echo ""
          echo "[FINAL] FINAL ENVIRONMENT: $ENV"
          echo "environment=$ENV" >> $GITHUB_OUTPUT
          echo "========================================="

      - name: Checkout repository
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3 (3.6.0)
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node_version || env.NODE_VERSION }}

      - name: Check if Terraform Apply is needed
        id: check
        run: |
          ENV="${{ steps.finalize-env.outputs.environment }}"
          # For workflow_dispatch on e2e environment, check skip_terraform_apply input
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            if [ "${{ inputs.skip_terraform_apply }}" == "true" ]; then
              echo "Skip Terraform Apply input is true - skipping Terraform Apply"
              echo "should-run-apply=false" >> $GITHUB_OUTPUT
            else
              echo "Workflow dispatch without skip flag - running Terraform Apply"
              echo "should-run-apply=true" >> $GITHUB_OUTPUT
            fi
            echo "coverage-only=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Push to non-main branches (develop, release/**): coverage-only run.
          # Keeps Coveralls baselines fresh on PR target branches without doing a
          # full deploy + E2E on every merge. See docs.coveralls.io/build-types.
          if [ "${{ github.event_name }}" == "push" ] && [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "Push to non-main branch - coverage-only run (skip terraform apply and E2E)"
            echo "should-run-apply=false" >> $GITHUB_OUTPUT
            echo "coverage-only=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Check for skip command in PR description
          if [ "${{ contains(github.event.pull_request.body || '', '/skip-terraform-apply') }}" == "true" ]; then
            echo "Skipping Terraform Apply via PR command /skip-terraform-apply"
            echo "should-run-apply=false" >> $GITHUB_OUTPUT
            echo "coverage-only=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Default: run Terraform Apply for all push/pull_request events
          echo "Running Terraform Apply by default"
          echo "should-run-apply=true" >> $GITHUB_OUTPUT
          echo "coverage-only=false" >> $GITHUB_OUTPUT

      - name: Determine Concurrency Group
        id: concurrency
        run: |
          echo "========================================="
          echo "STEP 4: Determine Concurrency Group"
          echo "========================================="

          ENV="${{ steps.finalize-env.outputs.environment }}"
          SHOULD_RUN_APPLY="${{ steps.check.outputs.should-run-apply }}"

          echo "Environment: $ENV"
          echo "Should run apply: $SHOULD_RUN_APPLY"
          echo ""

          if [ "$SHOULD_RUN_APPLY" == "true" ]; then
            # Sequential group for PRs that need terraform apply
            GROUP="terraform-pipeline-${ENV}-sequential"
            echo "[MODE] SEQUENTIAL (will queue behind other deployments on $ENV)"
            echo "   Concurrency group: $GROUP"
            echo ""
            echo "   This means:"
            echo "   - Only one deployment per environment at a time"
            echo "   - Ensures safe sequential deployments"
            echo "   - Each environment (e2e/e2e2) has independent queue"
          else
            # Unique group for parallel execution (each workflow run gets its own group)
            GROUP="terraform-pipeline-${ENV}-parallel-${{ github.run_id }}"
            echo "[MODE] PARALLEL (will run immediately, no queueing)"
            echo "   Concurrency group: $GROUP"
            echo ""
            echo "   This means:"
            echo "   - Skips terraform apply"
            echo "   - Can run multiple test-only jobs in parallel"
            echo "   - Each run has unique concurrency group"
          fi

          echo ""
          echo "[RESULT] Final concurrency group: $GROUP"
          echo "group=$GROUP" >> $GITHUB_OUTPUT
          echo "========================================="

      - name: Summary
        run: |
          echo ""
          echo "========================================"
          echo "  ENVIRONMENT DETERMINATION COMPLETE"
          echo "========================================"
          echo ""
          echo "[CONFIGURATION] Configuration Summary:"
          echo "   - Repository: ${{ github.repository }}"
          echo "   - Event: ${{ github.event_name }}"
          echo "   - Run ID: ${{ github.run_id }}"
          echo "   - Run Number: ${{ github.run_number }}"
          echo ""
          echo "[SELECTED] Selected Configuration:"
          echo "   - Environment: ${{ steps.finalize-env.outputs.environment }}"
          echo "   - Concurrency Group: ${{ steps.concurrency.outputs.group }}"
          echo "   - Will Deploy: ${{ steps.check.outputs.should-run-apply }}"
          echo ""
          echo "[NEXT STEPS] Next Steps:"
          echo "   - run-pipeline job will use this configuration"
          echo "   - Check concurrency queue for selected environment"
          echo "   - Deploy and run tests on: ${{ steps.finalize-env.outputs.environment }}"
          echo ""
          echo "========================================"

  # Wrapper job that holds concurrency lock and runs entire pipeline (deploy + tests)
  run-pipeline:
    needs: determine-environment
    concurrency:
      group: ${{ needs.determine-environment.outputs.concurrency-group }}
      cancel-in-progress: false
    uses: ./.github/workflows/deploy-and-test-reusable.yml
    secrets: inherit
    with:
      environment: ${{ needs.determine-environment.outputs.environment }}
      should_run_deploy: ${{ needs.determine-environment.outputs.should-run-apply == 'true' }}
      node_version: ${{ inputs.node_version || '22' }}
      aws_deploy_role: ${{ inputs.aws_deploy_role || vars.AWS_DEPLOY_ROLE }}
      secrets_repository: ${{ inputs.secrets_repository || vars.SECRETS_REPOSITORY }}
      run_automated_tests: ${{ github.event.inputs.run_automated_tests != 'false' || github.event_name != 'workflow_dispatch' }}
      run_ehr_e2e: ${{ needs.determine-environment.outputs.coverage-only != 'true' && (github.event.inputs.run_ehr_e2e != 'false' || github.event_name != 'workflow_dispatch') }}
      run_intake_e2e: ${{ needs.determine-environment.outputs.coverage-only != 'true' && (github.event.inputs.run_intake_e2e != 'false' || github.event_name != 'workflow_dispatch') }}
      pr_body: ${{ github.event.pull_request.body || '' }}
      github_ref: ${{ github.ref }}
      is_pull_request: ${{ github.event_name == 'pull_request' }}
