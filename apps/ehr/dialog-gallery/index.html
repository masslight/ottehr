<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dialog gallery</title>
    <style>
      /* Deterministic screenshots: no fades, no caret blink. */
      *,
      *::before,
      *::after {
        transition: none !important;
        animation: none !important;
        caret-color: transparent !important;
      }
      /* MUI X paints a "Missing license key" watermark above everything when no key is set; production has one. */
      div[style*="z-index: 100000"][style*="letter-spacing"] { display: none !important; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./harness/main.tsx"></script>
  </body>
</html>
